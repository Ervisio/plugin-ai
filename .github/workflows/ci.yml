# Builds the plugin, runs the tests, makes the release tarball and validates its manifest
# with the validator of Ervisio itself (plugin-sign from Ervisio/ervisio).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  ERVISIO_REF: v0.6.2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Version is the same everywhere
        run: npm run check
      - name: Tool reference is up to date
        run: python3 -B scripts/gen-tools-doc.py --check
      - name: Translations are complete
        run: node scripts/check-i18n.mjs
      - name: Build
        run: npm run build
      - name: Pack
        run: npm run pack
      - name: No Python bytecode in the package (the signature covers every file)
        run: |
          if [ -n "$(find dist -name '__pycache__' -o -name '*.pyc')" ]; then find dist -name '__pycache__' -o -name '*.pyc'; exit 1; fi
      - uses: actions/checkout@v4
        with:
          repository: Ervisio/ervisio
          ref: ${{ env.ERVISIO_REF }}
          path: .ervisio-core
      - uses: actions/setup-go@v5
        with:
          go-version-file: .ervisio-core/server/go.mod
          cache: false
      - name: Validate the manifest (Ervisio's own checks, throwaway key)
        run: |
          (cd .ervisio-core/server && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/plugin-sign" ./internal/modules/plugins/cmd/plugin-sign)
          id="$(node -p "require('./plugin/manifest.json').id")"
          version="$(node -p "require('./plugin/manifest.json').version")"
          tgz="dist/$id-$version.tar.gz"
          (cd dist && sha256sum -c "$id-$version.tar.gz.sha256")
          V="$RUNNER_TEMP/validate"; mkdir -p "$V"
          tar -xzf "$tgz" -C "$V"
          test "$(ls "$V")" = "$id"
          if [ -n "$(find "$V" ! -type f ! -type d)" ]; then echo "links or special files in the tarball"; exit 1; fi
          pub="$("$RUNNER_TEMP/plugin-sign" -genkey "$RUNNER_TEMP/throwaway.key" | sed -n 's/^public key: //p')"
          "$RUNNER_TEMP/plugin-sign" -key "$RUNNER_TEMP/throwaway.key" "$V/$id"
          "$RUNNER_TEMP/plugin-sign" -verify -pub "$pub" "$V/$id"
          rm -f "$RUNNER_TEMP/throwaway.key"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/*.tar.gz*
          retention-days: 7

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Tools the engine tests use
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux ripgrep openssl
      - uses: actions/checkout@v4
        with:
          repository: Ervisio/ervisio
          ref: ${{ env.ERVISIO_REF }}
          path: .ervisio-core
      - uses: actions/setup-go@v5
        with:
          go-version-file: .ervisio-core/server/go.mod
          cache: false
      - name: Build the Ervisio bridge (the engine is tested against the real one)
        run: |
          sudo apt-get install -y --no-install-recommends libpam0g-dev
          (cd .ervisio-core/server && go build -o "$RUNNER_TEMP/ervisio-bridge" ./cmd/ervisio-bridge)
          echo "ERVISIO_BRIDGE=$RUNNER_TEMP/ervisio-bridge" >> "$GITHUB_ENV"
      - name: Page (typecheck and unit tests)
        run: npm run typecheck && npm run test:ui
      - name: Engine
        run: npm run test:engine
      - name: Connector
        run: npm run test:connect
